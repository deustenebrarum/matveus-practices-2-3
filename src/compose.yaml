services:
  postgres:
    image: postgres:16-alpine
    container_name: vault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vaultcore_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vaultcore_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  vaultcore:
    build:
      context: ./VaultCore
      dockerfile: Dockerfile
    container_name: vault-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=${POSTGRES_DB:-vaultcore_dev};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy

  vault-browser:
    build:
      context: ./vault-browser
      dockerfile: Dockerfile
    container_name: vault-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://vaultcore:5000
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - vaultcore

volumes:
  pgdata:
